<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MALVIN - PORTOFOLIO</title>

    <link rel="preload" href="/src/fonts/DrukWide-Super.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/DrukWide-Medium.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- ===== INLINE SCRIPT: UNIVERSAL FIRST-LOAD RESET ===== -->
    <script>
      (function() {
        var path = window.location.pathname;
        
        // Regex ketat: HANYA match jika formatnya /project/slug-tanpa-slash
        var isValidProject = /^\/project\/[^/]+$/.test(path);
        
        if (isValidProject) {
          document.body.classList.add('page-project');
        } else {
          document.body.classList.remove('page-project');
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
